name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets the six-job matrix be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts proves better-sqlite3 works from its bundled prebuilt binaries with no compile step
      - name: environment
        shell: bash
        run: |
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          node --version
          npm --version
          git --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node bin/cli.js doctor
      - run: npm test
      # tests must not leave generated files behind in the working tree
      - name: working tree is clean
        shell: bash
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
      # npm pack, clean install, global install and CLI execution on every platform
      - run: node scripts/pack-smoke.mjs
