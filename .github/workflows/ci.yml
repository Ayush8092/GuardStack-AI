name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets the six-job matrix be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts proves better-sqlite3 works from its bundled prebuilt binaries with no compile step
      - name: environment
        shell: bash
        run: |
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          node --version
          npm --version
          git --version
      - run: npm ci --ignore-scripts
      - name: Diagnose Windows PowerShell security module
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable | Format-List
          Get-Module -ListAvailable Microsoft.PowerShell.Security |
            Select-Object Name, Version, Path | Format-List
          Get-Module Microsoft.PowerShell.Security |
            Select-Object Name, Version, Path | Format-List
          $env:PSModulePath -split ';'

      - run: npm run typecheck
      - run: npm run build
      - run: node bin/cli.js doctor
      - run: npm test
      # The Windows-only tests (process-tree termination, ACL checks) are skipped everywhere else and a skipped test is reported as a
      # pass. This step runs them again on Windows and fails unless each required one actually ran and passed; the TAP output is kept
      # as the evidence.
      - name: Windows evidence (process tree, ACLs) must run, not skip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --import tsx --test --test-reporter=tap test/process-safety-windows.test.ts test/cache-key-windows.test.ts > "$RUNNER_TEMP/windows-evidence.tap"
          cat "$RUNNER_TEMP/windows-evidence.tap"
          node scripts/assert-windows-evidence.mjs "$RUNNER_TEMP/windows-evidence.tap"
      - name: keep the Windows evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-node${{ matrix.node }}
          path: ${{ runner.temp }}/windows-evidence.tap
          if-no-files-found: warn
      # tests must not leave generated files behind in the working tree
      - name: working tree is clean
        shell: bash
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
      # npm pack, clean install, global install and CLI execution on every platform
      - run: node scripts/pack-smoke.mjs
